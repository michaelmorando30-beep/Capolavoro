<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galleria Foto – Croazia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">Croazia 2026</div>
        <button class="hamburger" id="hamburger" aria-label="Apri menu">&#9776;</button>
        <ul class="nav-links" id="nav-links">
            <li><a class="active" href="index.html">Home</a></li>
            <li><a href="destinazione.html">Destinazione</a></li>
            <li><a href="programma.html">Programma</a></li>
            <li><a href="galleria.html">Galleria</a></li>
            <li><a href="contatti.html">Contatti</a></li>
        </ul>
    </nav>

    <header class="page-header">
        <h1>Galleria Fotografica</h1>
        <p class="page-subtitle"></p>
    </header>

        <section>
            <h2 class="gallery-title">Zagabria</h2>
            <div class="gallery-grid">
                <figure class="gallery-item">
                    <img src="Mappa.jpeg" alt="La mappa" onerror="this.parentElement.classList.add('no-img')">
                    <figcaption>La mappa </figcaption>
                </figure>
                <figure class="gallery-item">
                    <img src="Cattedrale.jpeg" alt="La cattedrale" onerror="this.parentElement.classList.add('no-img')">
                    <figcaption>La cattedrale</figcaption>
                </figure>
                <figure class="gallery-item">
                    <img src="Lucchetti.jpeg" alt="Vista sul mare da Dubrovnik" onerror="this.parentElement.classList.add('no-img')">
                    <figcaption>Il paesaggio</figcaption>
                </figure>
            </div>
        </section>

        <section>
            <h2 class="gallery-title">Plivtice
            <div class="gallery-grid">
                <figure class="gallery-item">
                    <img src="Oscurità.jpeg" alt="Laghi" onerror="this.parentElement.classList.add('no-img')">
                    <figcaption>Palazzo di Diocleziano</figcaption>
                </figure>
                <figure class="gallery-item">
                    <img src="Elefante.jpeg" alt ="Laghi di Plitvice" onerror="this.parentElement.classList.add('no-img')">
                    <figcaption>Cascate dei Laghi di Plitvice</figcaption>
                </figure>
                <figure class="gallery-item">
                    <img src="PlivLAg.jpeg" alt="Sentieri di Plitvice" onerror="this.parentElement.classList.add('no-img')">
                    <figcaption>I laghi</figcaption>
                </figure>
            </div>
        </section>

        <section>
            <h2 class="gallery-title">Grotte di Postumia</h2>
            <div class="gallery-grid">
                <figure class="gallery-item">
                    <img src="G1.jpeg" alt="Organo del mare di Zara" onerror="this.parentElement.classList.add('no-img')">
                    <figcaption>Le grotte </figcaption>
                </figure>
                <figure class="gallery-item">
                    <img src="G2.jpeg" alt="Centro storico di Zara" onerror="this.parentElement.classList.add('no-img')">
                    <figcaption>Le grotte</figcaption>
                </figure>
                <figure class="gallery-item">
                    <img src="G3.jpeg" alt="Traù" onerror="this.parentElement.classList.add('no-img')">
                    <figcaption>Le grotte</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>Viaggio di istruzione in Croazia 2026</p>
    </footer>
</body>
</html>
